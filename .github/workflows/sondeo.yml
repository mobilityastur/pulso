name: Sondeo (temporal)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) Pulso"
          curl -sSL -A "$UA" -m 30 -o p.html https://ica.miteco.es/
          M=$(grep -oE 'main\.[a-f0-9]+\.js' p.html | head -1); echo "MAIN=$M"
          curl -sSL -A "$UA" -m 60 -o main.js "https://ica.miteco.es/$M"; ls -la main.js
          echo "--- URLs"; grep -oE '"https?://[^"]{6,160}"' main.js | sort -u | head -40
          echo "--- rutas"; grep -oE '"/?[a-zA-Z0-9_\-]*/?(api|rest|ws|servicio|datos|estaciones|ica|previs)[a-zA-Z0-9_\-/.]*"' main.js | sort -u | head -40
          echo "--- environment"; grep -oE '(apiUrl|baseUrl|urlApi|API_URL|endpoint)[^,;]{0,160}' main.js | head -20
          echo "=== OPEN-METEO"; curl -sSL -m 30 "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=43.36,40.42&longitude=-5.85,-3.70&current=european_aqi,pm10,pm2_5,nitrogen_dioxide,ozone&timezone=Europe%2FMadrid" | head -c 700; echo
