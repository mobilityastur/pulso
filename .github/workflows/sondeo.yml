name: Sondeo (temporal)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) Pulso"
          curl -sSL -A "$UA" -m 30 -o p.html https://ica.miteco.es/
          M=$(grep -oE 'main\.[a-f0-9]+\.js' p.html | head -1)
          curl -sSL -A "$UA" -m 60 -o main.js "https://ica.miteco.es/$M"
          python3 - <<'PY'
          import re
          s=open('main.js',encoding='utf8',errors='replace').read()
          for m in re.finditer(r'urlApi\}?\$?\{?', s):
              pass
          seen=set()
          for m in re.finditer(r'(get|post)\(`\$\{[^}]+\}([^`]{0,120})`', s):
              p=m.group(2)
              if p not in seen: seen.add(p); print('RUTA', m.group(1), p)
          for m in re.finditer(r'"(ica|estacion|estaciones|datos|prevision|contaminante|municipio|red|actual)[A-Za-z0-9_/\-]{0,60}"', s):
              if m.group(0) not in seen: seen.add(m.group(0)); print('LIT', m.group(0))
          i=s.find('urlApi')
          for k in [x.start() for x in re.finditer('urlApi', s)][:12]:
              print('CTX', s[max(0,k-80):k+160].replace('\n',' '))
          PY
