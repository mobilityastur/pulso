name: Sondeo (temporal)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: |
          set +e
          Q='[out:json][timeout:15];nwr(around:2500,43.52,-5.72)[industrial];out tags center 5;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            echo "== curl $u"; curl -s -m 30 -o /dev/null -w "%{http_code} %{time_total}s\n" -A "Pulso/1.0" --data-urlencode "data=$Q" "$u"
          done
          cat > t.mjs <<'JS'
          const Q = '[out:json][timeout:15];nwr(around:2500,43.52,-5.72)[industrial];out tags center 5;';
          for (const u of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter']) {
            for (const [nombre, opts] of [
              ['form', { method: 'POST', body: new URLSearchParams({ data: Q }), headers: { 'User-Agent': 'Pulso/1.0', 'Content-Type': 'application/x-www-form-urlencoded' } }],
              ['get', { method: 'GET', headers: { 'User-Agent': 'Pulso/1.0' } }],
            ]) {
              const t0 = Date.now();
              try { const url = nombre === 'get' ? `${u}?data=${encodeURIComponent(Q)}` : u;
                const r = await fetch(url, { ...opts, signal: AbortSignal.timeout(25000) }); const txt = await r.text();
                console.log('node', nombre, u, r.status, Date.now() - t0, 'ms', txt.length, 'bytes'); }
              catch (e) { console.log('node', nombre, u, 'ERROR', e.message, Date.now() - t0, 'ms', e.cause?.code ?? ''); }
            }
          }
          JS
          node t.mjs
