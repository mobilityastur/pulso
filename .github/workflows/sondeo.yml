name: Sondeo (temporal)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) Pulso"
          curl -sSL --http1.1 -A "$UA" -m 60 -D h.txt -o p.html "https://gis.miteco.gob.es/descargas/app/DescargaFichero?f=sitesfacilities-pf.zip"; cat h.txt | head -20; sed 's/<[^>]*>/ /g' p.html | tr -s ' \n' | head -c 1500; echo; grep -oiE '(href|action|src)="[^"]+"' p.html | head
          echo "=== ATOM"; curl -sSL -A "$UA" -m 60 -o a.xml "http://gis.miteco.gob.es/descargas/atom/CategCalidadEvalAmbiental/downloadservice.xml"; ls -la a.xml; grep -oiE 'href="[^"]*(site|facilit|instala|prtr|emplaz)[^"]*"' a.xml | sort -u | head
          for u in $(grep -oiE 'href="[^"]*(site|facilit|emplaz)[^"]*\.xml"' a.xml | sed 's/href="//;s/"$//' | sort -u | head -3); do echo "--- $u"; curl -sSL -A "$UA" -m 60 "$u" | grep -oiE 'href="[^"]+"' | sort -u | head -15; done
