name: Sondeo (temporal)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL --http1.1 --retry 3 -A "Mozilla/5.0 Pulso" -m 300 -o bd.zip "https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/evaluacion-de-los-recursos-hidricos/boletin-hidrologico/Historico-de-embalses/BD-Embalses.zip"
          ls -la bd.zip; unzip -l bd.zip; unzip -q -o bd.zip -d bd
          sudo apt-get install -y -qq mdbtools >/dev/null 2>&1 || true
          for f in bd/*; do echo "== $f"; file "$f"; done
          F=$(ls bd/*.mdb bd/*.accdb 2>/dev/null | head -1); echo "MDB=$F"
          if [ -n "$F" ]; then mdb-tables -1 "$F"; for t in $(mdb-tables -1 "$F"); do echo "--- $t"; mdb-export "$F" "$t" | head -4; mdb-export "$F" "$t" | wc -l; done; T=$(mdb-tables -1 "$F" | head -1); mdb-export "$F" "$T" | tail -3; fi
          for f in bd/*.csv bd/*.xlsx; do [ -f "$f" ] && head -c 600 "$f"; done; true
