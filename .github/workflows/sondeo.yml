name: Sondeo (temporal)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          cat > q.py <<'PY'
          import json, urllib.request, urllib.parse, math, time
          puntos = [('Arcelor Gijon',43.5232,-5.727),('Arcelor Aviles',43.5394,-5.8286),('Sagunto?',39.66,-0.24),('Alcanar?',40.58,0.54),('Alcala Guadaira?',37.36,-5.86),('Agost?',38.38,-0.54),('Cantabria 43.04,-3.50',43.04,-3.50),('Girona 41.92,2.66',41.92,2.66)]
          for n, la, lo in puntos:
              q = f"""[out:json][timeout:25];
              (nwr(around:2500,{la},{lo})[man_made~"^(works|flare|kiln|chimney)$"];
               nwr(around:2500,{la},{lo})[industrial];
               nwr(around:2500,{la},{lo})[power=plant];
               nwr(around:2500,{la},{lo})[landuse=industrial][name];);
              out tags center 40;"""
              req = urllib.request.Request('https://overpass-api.de/api/interpreter', data=urllib.parse.urlencode({'data': q}).encode(), headers={'User-Agent': 'Pulso/1.0 (github.com/mobilityastur/pulso)'})
              try:
                  j = json.load(urllib.request.urlopen(req, timeout=60))
              except Exception as e:
                  print('###', n, 'ERROR', e); continue
              res = []
              for e in j['elements']:
                  t = e.get('tags', {}); c = e.get('center') or {'lat': e.get('lat'), 'lon': e.get('lon')}
                  if c['lat'] is None: continue
                  d = math.hypot((c['lat']-la)*111.2, (c['lon']-lo)*111.2*math.cos(math.radians(la)))
                  res.append((round(d,2), t.get('name') or t.get('operator') or '-', {k: t[k] for k in t if k in ('man_made','industrial','product','operator','power','plant:source','landuse')}))
              res.sort(key=lambda x: x[0])
              print('###', n, len(res)); [print('   ', r) for r in res[:6]]
              time.sleep(2)
          PY
          python3 q.py
