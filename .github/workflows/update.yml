name: Actualizar datos

on:
  workflow_dispatch: {}        # lo lanza cron-job.org cada 15 min
  schedule:
    - cron: '17 * * * *'       # respaldo: cada hora por si cron-job.org falla

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar datos
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/update.mjs

      - name: Guardar cambios
        run: |
          git config user.name  "pulso-bot"
          git config user.email "pulso-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
