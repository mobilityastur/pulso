name: Actualizar lista de instalaciones (OpenStreetMap)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 3 2 * *'   # día 2 de cada mes

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  industrias:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Descargar el extracto de España (Geofabrik)
        run: |
          curl -sSL --retry 3 -A "Pulso (github.com/mobilityastur/pulso)" -o espana.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          ls -lh espana.osm.pbf

      - name: Filtrar instalaciones industriales
        run: |
          osmium tags-filter espana.osm.pbf nwr/industrial nwr/man_made=works,flare,kiln nwr/power=plant nwr/landuse=industrial -o ind.osm.pbf --overwrite
          osmium export ind.osm.pbf -f geojsonseq -o ind.geojsonseq --overwrite
          node scripts/industrias.mjs ind.geojsonseq
          ls -lh data/industrias-osm-es.json

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add data/industrias-osm-es.json
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "industrias: lista de OpenStreetMap"
            git pull --rebase --autostash && git push
          fi
